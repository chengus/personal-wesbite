name = "lucentgpt-mail"
main = "index.mjs"
compatibility_date = "2026-09-09"
workers_dev = false
preview_urls = false
routes = [{ pattern = "lucentlu.com/api/*", zone_name = "lucentlu.com" }]

[vars]
FROM_EMAIL = "lucentgpt@lucentlu.com"
TO_EMAIL = "1215.lucent@gmail.com"
REPLY_EMAIL = "replies@lucentlu.com"
ALLOWED_ORIGINS = "https://lucentlu.com,https://www.lucentlu.com"

[[send_email]]
name = "EMAIL"
destination_address = "1215.lucent@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "lucentgpt"
database_id = "f818320b-77c0-4e25-a9df-52aceeca25e3" 
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false
